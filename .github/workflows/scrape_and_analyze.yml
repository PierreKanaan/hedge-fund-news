name: Scrape, analyze, and email fund news digest

on:
  schedule:
    # Targets 3:00 AM Beirut time (not 6:00) - GitHub Actions scheduled
    # workflows are NOT guaranteed to fire exactly on time (delays of
    # minutes to several hours are documented/common, especially for
    # triggers set at the exact top of the hour, which is why the minute is
    # offset to :13 here). Targeting 3am instead of 6am builds in a buffer
    # so a delayed run still lands well before the morning.
    #
    # GitHub Actions cron always runs in UTC and does NOT auto-adjust for
    # daylight saving, so this must be updated by hand twice a year:
    #   - Beirut summer time (EEST, UTC+3, roughly late March - late October): use "13 0 * * *"
    #   - Beirut winter time (EET, UTC+2, roughly late October - late March):  use "13 1 * * *"
    # Currently set for EEST (summer). When Lebanon switches back to winter
    # time, change the line below from "13 0" to "13 1".
    - cron: "13 0 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -m src.pipeline

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update news digest data [automated]"
          file_pattern: "data/**"

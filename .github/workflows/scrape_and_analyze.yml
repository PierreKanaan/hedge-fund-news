name: Scrape, analyze, and email fund news digest

on:
  schedule:
    # Every day at 6:00 AM Beirut time. GitHub Actions cron always runs in UTC
    # and does NOT auto-adjust for daylight saving, so this hour must be
    # updated by hand twice a year:
    #   - Beirut summer time (EEST, UTC+3, roughly late March - late October): use "0 3 * * *"
    #   - Beirut winter time (EET, UTC+2, roughly late October - late March):  use "0 4 * * *"
    # Currently set for EEST (summer). When Lebanon switches back to winter
    # time, change the line below from "0 3" to "0 4".
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -m src.pipeline

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update news digest data [automated]"
          file_pattern: "data/**"
